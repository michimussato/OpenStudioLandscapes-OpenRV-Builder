# Resources:
# - [dagster.yaml reference](https://docs.dagster.io/deployment/oss/dagster-yaml)
# - [Instance configuration](https://docs.dagster.io/deployment/oss/oss-instance-configuration)
# - [Managing concurrency](https://docs.dagster.io/guides/limiting-concurrency-in-data-pipelines)
auto_materialize:
  enabled: true
  use_sensors: true
concurrency:
  default_op_concurrency_limit: 1
run_queue:
  block_op_concurrency_limited_runs:
    enabled: true
  max_concurrent_runs: 1
telemetry:
  enabled: false
